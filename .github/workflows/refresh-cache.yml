name: Refresh Bogotá cache

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Refresh shared cache
        env:
          CACHE_REFRESH_URL: ${{ secrets.CACHE_REFRESH_URL }}
          CACHE_REFRESH_SECRET: ${{ secrets.CACHE_REFRESH_SECRET }}
        run: |
          curl --fail-with-body --show-error \
            --connect-timeout 15 \
            --max-time 900 \
            --request POST \
            "$CACHE_REFRESH_URL" \
            --header "X-Cache-Refresh-Secret: $CACHE_REFRESH_SECRET"
